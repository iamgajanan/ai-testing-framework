name: AI Testing Framework CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run unit tests
        run: pytest -q

      - name: Start demo app
        run: |
          python examples/demo_app.py &
          sleep 2
          curl -sf http://127.0.0.1:8000/api/search?q=ping

      - name: E2E — Phase 2B (sequential)
        run: |
          ai-test --file tests/sample_tests/test_suite.json \
                  --base-url http://127.0.0.1:8000 \
                  --ai-provider none --format html json

      - name: E2E — Phase 3 AI locator
        run: |
          ai-test --file tests/sample_tests/ai_locator_suite.json \
                  --base-url http://127.0.0.1:8000 \
                  --ai-provider none

      - name: E2E — Phase 4 self-healing
        run: |
          ai-test --file tests/sample_tests/self_healing_suite.json \
                  --base-url http://127.0.0.1:8000 \
                  --ai-provider none --format all

      - name: E2E — Phase 6 parallel (3 workers)
        run: |
          ai-test --file tests/sample_tests/parallel_suite.json \
                  --base-url http://127.0.0.1:8000 \
                  --ai-provider none --workers 3

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 14
