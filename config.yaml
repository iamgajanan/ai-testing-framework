browser: chromium
headless: true
timeout: 30000

ai:
  provider: none          # openai | none
  model: gpt-4o-mini
  analyze_failures: true

self_healing:
  enabled: true
  min_confidence: 0.70

report:
  output_dir: reports
  html: true
  json: true
  pdf: false
  formats: [html, json]

screenshots:
  on_failure: true

parallel:
  workers: 1
