browser: chromium
headless: true
timeout: 30000

ai:
  provider: none   # openai | none
  model: gpt-4o-mini

report:
  output_dir: reports
  html: true
  json: true
  pdf: false        # set true or use --format pdf to emit PDF
  formats: [html, json]

screenshots:
  on_failure: true

parallel:
  workers: 1        # >1 runs tests concurrently (each gets its own browser)
